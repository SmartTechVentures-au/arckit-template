name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint & validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Ruff
        run: pip install ruff==0.17.0

      - name: Ruff lint
        run: ruff check scripts/ .devcontainer/ tests/

      - name: Ruff format check
        run: ruff format --check scripts/ .devcontainer/ tests/

      - name: ShellCheck
        run: |
          shopt -s nullglob
          shellcheck scripts/*.sh .devcontainer/*.sh tests/*.sh

      - name: Provisioning regression tests
        run: python -m unittest discover -s tests -v

      - name: Validate JSON
        run: |
          python -m json.tool package.json > /dev/null
          python -m json.tool .devcontainer/devcontainer.json > /dev/null
          python -m json.tool .devcontainer/devcontainer-lock.json > /dev/null
          python -m json.tool .vscode/tasks.json > /dev/null
          echo "JSON files are valid."

  docker-build:
    name: Build dev container image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .devcontainer/Dockerfile
          push: false
          load: true
          tags: arckit-template:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify tools, all shell environments, and docs server
        run: bash tests/container-smoke.sh arckit-template:test
